name: Deploy Lambda Images

on:
  push:
    branches: [ "main" ]
    paths:
      - "lambdas/**"
      - ".github/workflows/deploy.yml"
      - "README.md"

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "946869378835"
  # 统一的函数名（与你现有云上函数一致）
  FN_RESIZE: "resize-lambda-fn"
  FN_GREYSCALE: "greyscale-lambda-fn"
  FN_EXIF: "exif-lambda-fn"

jobs:
  deploy-resize:
    name: Build & Deploy resize-lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push resize image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: resize-lambda
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd lambdas/resize
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create or update Lambda function (resize)
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image }}"
          ROLE_ARN="${{ secrets.LAMBDA_ROLE_ARN }}"
          FN_NAME="${{ env.FN_RESIZE }}"

          # 如果函数不存在则创建，存在就更新
          set -e
          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FN_NAME" --image-uri "$IMAGE_URI"
          else
            aws lambda create-function \
              --function-name "$FN_NAME" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$ROLE_ARN" \
              --timeout 60 --memory-size 512 \
              --architectures x86_64
          fi

  deploy-greyscale:
    name: Build & Deploy greyscale-lambda
    runs-on: ubuntu-latest
    needs: [deploy-resize]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push greyscale image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: greyscale-lambda
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd lambdas/greyscale
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create or update Lambda function (greyscale)
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image }}"
          ROLE_ARN="${{ secrets.LAMBDA_ROLE_ARN }}"
          FN_NAME="${{ env.FN_GREYSCALE }}"

          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FN_NAME" --image-uri "$IMAGE_URI"
          else
            aws lambda create-function \
              --function-name "$FN_NAME" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$ROLE_ARN" \
              --timeout 60 --memory-size 512 \
              --architectures x86_64
          fi

  deploy-exif:
    name: Build & Deploy exif-lambda
    runs-on: ubuntu-latest
    needs: [deploy-greyscale]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push exif image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: exif-lambda
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd lambdas/exif
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create or update Lambda function (exif)
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image }}"
          ROLE_ARN="${{ secrets.LAMBDA_ROLE_ARN }}"
          FN_NAME="${{ env.FN_EXIF }}"

          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FN_NAME" --image-uri "$IMAGE_URI"
          else
            aws lambda create-function \
              --function-name "$FN_NAME" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$ROLE_ARN" \
              --timeout 60 --memory-size 512 \
              --architectures x86_64
          fi
