name: Deploy Lambda Images

on:
  push:
    branches: [ "main" ]
    paths:
      - "lambdas/**"
      - ".github/workflows/deploy.yml"
      - "README.md"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "946869378835"

jobs:
  deploy:
    name: Build & Deploy (${{ matrix.repo }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - fn: "resize-lambda"
            dir: "lambdas/resize"
            repo: "resize-lambda"
          - fn: "greyscale-lambda"
            dir: "lambdas/greyscale"
            repo: "greyscale-lambda"
          - fn: "exif-lambda"
            dir: "lambdas/exif"
            repo: "exif-lambda"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "${{ matrix.dir }}"
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag  "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update Lambda function
        env:
          IMAGE_URI: ${{ steps.build.outputs.IMAGE_URI }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          FN_NAME: ${{ matrix.fn }}
        run: |
          set -euo pipefail
          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            echo "Updating code for: $FN_NAME"
            aws lambda update-function-code --function-name "$FN_NAME" --image-uri "$IMAGE_URI"
          else
            echo "Creating function: $FN_NAME"
            aws lambda create-function \
              --function-name "$FN_NAME" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$ROLE_ARN" \
              --timeout 60 \
              --memory-size 512 \
              --architectures x86_64
          fi

      # 用单行命令，避免续行符问题
      - name: Show deployed image
        run: aws lambda get-function --function-name "${{ matrix.fn }}" --query 'Code.ImageUri' --output text
